version: '3.8'

services:
  # --- 1. 資料庫 (PostgreSQL) ---
  db:
    image: postgres:16-alpine
    container_name: savote-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: savote_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - savote-network

  # --- 2. 後端 (NestJS API) ---
  api:
    ports:
      - "3000:3000"
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: savote-api
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: "postgresql://postgres:password@db:5432/savote_db?schema=public"
      NODE_ENV: development
    depends_on:
      db:
        condition: service_healthy
    # 使用 db push 模式：同步結構
    command: >
      sh -c "cd apps/api && npx prisma db push --accept-data-loss && npx prisma db seed && npm run start:prod"
    restart: always
    networks:
      - savote-network

  # --- 3. 前端 + 網關 (Nginx + React) ---
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: "${CORS_ORIGIN:-http://127.0.0.1:8080}/api"
    container_name: savote-web
    ports:
      - "8080:80"
    environment:
      VITE_API_BASE_URL: "${CORS_ORIGIN:-http://127.0.0.1:8080}/api"
    depends_on:
      - api
    restart: always
    networks:
      - savote-network

networks:
  savote-network:
    driver: bridge

volumes:
  postgres_data:
