# 定義連線升級邏輯 (用於 WebSocket)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    http2 on;
    server_name sa-election.ncue.edu.tw;

    # SSL 證書設定
    ssl_certificate /etc/nginx/cert/cert.pem;
    ssl_certificate_key /etc/nginx/cert/privkey.pem;

    # ==========================================
    # SSL 安全強化 (修正中度風險：弱加密套件)
    # ==========================================
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    
    # 新增：明確指定強加密套件，移除報告中提到的弱金鑰與 CBC 模式漏洞 [cite: 95, 106, 114]
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ==========================================
    # HTTP 安全標頭 (修正中度風險與資訊型風險)
    # ==========================================
    # 1. 啟用 HSTS (強制瀏覽器使用 HTTPS) [cite: 68, 69, 73]
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # 2. X-Content-Type-Options (防止 MIME 類型嗅探) [cite: 459, 461, 467]
    add_header X-Content-Type-Options "nosniff" always;

    # 3. Content Security Policy (CSP) 
    # 依據報告建議，移除了 unsafe-inline, unsafe-eval, data: 以及 scheme URI (https:) [cite: 261, 263, 291, 342, 442]
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' https:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; frame-src 'self' https://drive.google.com https://docs.google.com; worker-src 'self' blob:; upgrade-insecure-requests;" always;

    # 4. Permissions-Policy (限制特定瀏覽器 API 的使用) [cite: 396]
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
    
    # 5. 防範點擊劫持 (建議額外加上)
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 伺服器端設定：獲取真實 IP (Cloudflare IP 段保留不變)
    set_real_ip_from 10.21.44.251;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/12;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # 反向代理到 Docker 容器 (savote-web 運行在 8080)
    location / {
        proxy_pass http://localhost:8080;
        
        # 標頭資訊傳遞
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # 傳遞真實客戶端 IP
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 上傳檔案限制
        client_max_body_size 10M;
    }
}
